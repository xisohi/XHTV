import com.android.build.api.artifact.SingleArtifact
import com.fongmi.gradle.AbiApkPackaging

plugins {
    alias libs.plugins.android.application
}

android {
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        applicationId "com.fongmi.android.sohi"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 563
        versionName "5.6.3"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
    }

    flavorDimensions = ["device"]

    productFlavors {
        leanback {
            dimension "device"
        }
        mobile {
            dimension "device"
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    signingConfigs {
        release {
            // 复用 Android 插件内置的 debug 签名配置
            storeFile = signingConfigs.debug.storeFile
            storePassword = signingConfigs.debug.storePassword
            keyAlias = signingConfigs.debug.keyAlias
            keyPassword = signingConfigs.debug.keyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            signingConfig = signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
            force 'org.jetbrains:annotations:23.0.0'
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
    }

    packagingOptions {
        jniLibs {
            pickFirsts += [
                    'lib/*/libavcodec.so',
                    'lib/*/libavformat.so',
                    'lib/*/libavutil.so',
                    'lib/*/libswresample.so',
                    'lib/*/libswscale.so',
                    'lib/*/libavfilter.so',
                    'lib/*/libavdevice.so',
            ]
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

AbiApkPackaging.configure(project, SingleArtifact.APK.INSTANCE)

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation libs.appcompat
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.android.gif.drawable
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.rtmp.client
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
    // ===== Media3 依赖 (使用 Maven 坐标，复合构建会自动使用本地源码) =====
    def media3_version = '1.11.0'

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-common:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-cast:$media3_version"

    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation "androidx.media3:media3-exoplayer-smoothstreaming:$media3_version"
    implementation "androidx.media3:media3-exoplayer-rtsp:$media3_version"
    implementation "androidx.media3:media3-exoplayer-ima:$media3_version"
    implementation "androidx.media3:media3-exoplayer-workmanager:$media3_version"

    implementation "androidx.media3:media3-datasource:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"

    implementation "androidx.media3:media3-decoder:$media3_version"
    implementation "androidx.media3:media3-decoder-av1:$media3_version"
    implementation "androidx.media3:media3-decoder-ffmpeg:$media3_version"
    implementation "androidx.media3:media3-decoder-flac:$media3_version"
    implementation "androidx.media3:media3-decoder-iamf:$media3_version"
    implementation "androidx.media3:media3-decoder-mpegh:$media3_version"
    implementation "androidx.media3:media3-decoder-opus:$media3_version"
    implementation "androidx.media3:media3-decoder-vp9:$media3_version"

    implementation "androidx.media3:media3-container:$media3_version"
    implementation "androidx.media3:media3-database:$media3_version"
    implementation "androidx.media3:media3-effect:$media3_version"
    implementation "androidx.media3:media3-extractor:$media3_version"
    implementation "androidx.media3:media3-inspector:$media3_version"
    implementation "androidx.media3:media3-muxer:$media3_version"
    implementation "androidx.media3:media3-mpvplayer:$media3_version"

    leanbackImplementation "androidx.media3:media3-ui-leanback:$media3_version"
}