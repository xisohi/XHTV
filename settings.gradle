pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
    }
    includeBuild("media/build-logic-settings")

    // ===== 新增：强制所有 Kotlin 插件使用统一版本 =====
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id.startsWith("org.jetbrains.kotlin")) {
                useVersion("2.0.21")  // 使用与你的项目兼容的版本
            }
        }
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
    id 'gradlebuild.media3-settings-logic'
}

def mediaRepoPath = "media"
if (file(mediaRepoPath).exists()) {
    includeMedia3.execute(file(mediaRepoPath))
} else {
    println "警告: Media3 仓库路径不存在: ${mediaRepoPath}，跳过本地引入。"
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
    }
}

include ':app'
include ':catvod'
include ':chaquo'
include ':quickjs'
rootProject.name = "TV"
